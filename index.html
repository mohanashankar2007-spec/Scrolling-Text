<!DOCTYPE html> 
<html> 
<head> 
<title>Scrolling Text</title> 
</head> 
<body> 
<h2 align="center">HTML Marquee Tag - Demonstration</h2> 
<marquee behavior="scroll" direction="left" scrollamount="5" bgcolor="yellow"> 
    <img src="images/html.png" width="80" height="90" alt="HTML">
Welcome to Web Technology Lab - 24UIT506 
</marquee> 
<br> 
<marquee behavior="alternate" direction="right" scrollamount="8" bgcolor="lightgreen"> 
     <img src="images/css.png" width="50" height="50"><br>
This text bounces back and forth 
</marquee> 
<br> 
<marquee direction="up" height="150" bgcolor="lightblue"> 
 <img src="images/css.png" width="100" height="100"><br> 
</marquee> 
<br> 
<marquee behavior="scroll" direction="left" scrollamount="6" onmouseover="this.stop();" 
onmouseout="this.start();" bgcolor="pink"> 
Move mouse over this text to pause it 
</marquee> 
</body> 
</html>
